services:
  - type: web
    name: autocare-hub
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_READ_ONLY
        value: "true"
      - key: VITE_DEMO_READ_ONLY
        value: "true"
      - key: VITE_DEMO_SANDBOX
        value: "true"
      - key: DATABASE_URL
        sync: false
